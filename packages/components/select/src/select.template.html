<div class="ui-select" part="field">
  <span class="ui-select__label" part="label" hidden>{{label}}</span>
  <button
    class="ui-select__trigger"
    part="trigger"
    type="button"
    role="combobox"
    aria-haspopup="listbox"
    aria-expanded="false"
  >
    <span class="ui-select__value" part="value"></span>
    <span class="ui-select__chevron" part="chevron" aria-hidden="true"></span>
  </button>
  <ul class="ui-select__listbox" part="listbox" role="listbox" hidden></ul>
</div>
